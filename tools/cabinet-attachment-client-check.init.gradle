gradle.afterProject { p ->
    if (p != p.rootProject) return
    p.sourceSets.main.java.srcDir('tools/cabinet-attachment-client-check')
    p.runs.client {
        systemProperty 'cabinetAttachment.checkReport', p.file('build/cabinet-attachment-client-check/results.txt').absolutePath
        systemProperty 'forge.logging.console.level', 'info'
    }
}
